name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 11 * * *"   # daily, about 6:17 AM Eastern: refresh Google Scholar numbers
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh citations and publications from Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_scholar.py

      - name: Save refreshed numbers to the repository
        run: |
          if ! git diff --quiet -- dist/data/scholar.json dist/knowledge.md; then
            git config user.name "scholar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/data/scholar.json dist/knowledge.md
            git commit -m "Update Google Scholar metrics"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
